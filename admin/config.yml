# Decap CMS configuration for the ORCID homepage.
#
# The backend is `test-repo`: the editor runs entirely in the visitor's browser
# against a seeded copy of content/home.en.json, and nothing is written to this
# repository by the CMS itself. Publishing hands the change to GitHub as an
# issue, which a workflow turns into a pull request. That is deliberate. It
# means the editor needs no login and holds no credentials, while every change
# still arrives signed in by a GitHub account and reviewed before it is merged.
#
# See boot.js for the seeding and the hand-off, and README.md for the flow.
backend:
  name: test-repo

site_url: https://orcid.github.io/orcid-homepage-decap-cms/qa/
display_url: https://orcid.github.io/orcid-homepage-decap-cms/qa/
logo_url: https://orcid.org/assets/vectors/orcid.logo.icon.svg

media_folder: content/images
public_folder: images

# Uploading a new image is deliberately not part of this demo: a proposal
# travels as JSON in a GitHub issue and cannot carry a binary. Editors pick
# from the images already in the repository.

# The collections block below is generated from schema/catalogue.json by
# `npm run gen`. Editing it by hand is pointless: CI regenerates it and fails on
# any difference. Change the catalogue instead, which also updates the JSON
# Schema and the renderer's types in the same commit.
# BEGIN GENERATED — scripts/gen/cms-config.mjs from schema/catalogue.json.
# Do not edit inside the markers by hand. Run `npm run gen` after changing
# the catalogue; CI fails when the committed block and the catalogue differ.
collections:
  - name: homepage
    label: Homepage
    label_singular: Homepage
    description: The content of orcid.org. Edit the English text here. Translations are handled separately and are matched to each item by its ID, so changing an ID discards that item’s translations.
    format: json
    files:
      - name: home
        label: Homepage content
        file: content/home.en.json
        fields:
          - name: schemaVersion
            label: Schema version
            widget: hidden
            default: 2
          - name: catalogueVersion
            label: Catalogue version
            widget: hidden
            default: 1
          - name: page
            label: Page
            widget: object
            fields:
              - name: title
                label: Page heading
                widget: string
                pattern:
                  [
                    '^[^\n\r]{1,120}$',
                    'One line, no line breaks, max 120 characters',
                  ]
                hint: The one h1 on the page. Every section heading sits under it.
              - name: description
                label: Search engine description
                widget: string
                pattern:
                  [
                    '^[^\n\r]{1,200}$',
                    'One line, no line breaks, max 200 characters',
                  ]
                hint: One sentence, shown in search results and when the page is shared.
          - name: sections
            label: Sections
            label_singular: Section
            widget: list
            typeKey: type
            min: 1
            max: 24
            allow_reorder: true
            collapsed: true
            minimize_collapsed: false
            summary: '{{fields.id}}'
            hint: The page from top to bottom. Drag a section to move it.
            types:
              - name: audience-selector
                label: Audience selector
                widget: object
                summary: Audience selector — {{title}}
                fields:
                  - name: title
                    label: Heading
                    widget: string
                    pattern:
                      [
                        '^[^\n\r]{1,120}$',
                        'One line, no line breaks, max 120 characters',
                      ]
                    required: false
                    hint: Leave empty when the page title above already says it.
                  - name: variant
                    label: How it displays
                    widget: select
                    options:
                      - label: Tabs with background photo (recommended)
                        value: tabs-photo
                      - label: Tabs, flat brand colour
                        value: tabs-flat
                      - label: Stacked list — every audience always visible
                        value: stacked
                    default: tabs-photo
                    hint: 'Tabs with background photo (recommended): Matches orcid.org today. Becomes an accordion below 1024px. Stacked list — every audience always visible: Best for search engines and for screen readers. No interaction needed.'
                  - name: audiences
                    label: Audiences
                    label_singular: Audience
                    widget: list
                    min: 1
                    max: 8
                    collapsed: true
                    minimize_collapsed: false
                    summary: '{{label}}'
                    allow_add: true
                    allow_remove: true
                    allow_reorder: true
                    fields:
                      - name: label
                        label: Tab label
                        widget: string
                        pattern:
                          [
                            '^[^\n\r]{1,60}$',
                            'One line, no line breaks, max 60 characters',
                          ]
                        hint: Short. It has to fit a tab across six of them, in German.
                      - name: intro
                        label: Introduction
                        widget: text
                        hint: '**bold** and [text](https://…) links are supported; nothing else is. Up to 800 characters.'
                      - name: background
                        label: Background photo
                        widget: object
                        collapsed: true
                        required: false
                        fields:
                          - name: src
                            label: File
                            widget: image
                            allow_multiple: false
                            choose_url: false
                            media_folder: /content/images
                            public_folder: images
                          - name: focalPoint
                            label: Keep this part in view
                            widget: select
                            options:
                              - label: Middle
                                value: center
                              - label: Top
                                value: top
                              - label: Bottom
                                value: bottom
                              - label: Left in most languages, right in Arabic
                                value: start
                              - label: Right in most languages, left in Arabic
                                value: end
                            default: center
                            required: false
                            hint: Which part of the picture stays in view when it is cropped.
                      - name: features
                        label: Features
                        label_singular: Feature
                        widget: list
                        min: 1
                        max: 4
                        collapsed: true
                        minimize_collapsed: false
                        summary: '{{title}}'
                        allow_reorder: true
                        fields:
                          - name: title
                            label: Title
                            widget: string
                            pattern:
                              [
                                '^[^\n\r]{1,80}$',
                                'One line, no line breaks, max 80 characters',
                              ]
                            required: false
                          - name: body
                            label: Text
                            widget: text
                            hint: '**bold** and [text](https://…) links are supported; nothing else is. Up to 500 characters.'
                          - name: icon
                            label: Icon
                            widget: object
                            collapsed: true
                            required: false
                            hint: Small decorative icon. The title carries the meaning, so no description is collected.
                            fields:
                              - name: src
                                label: File
                                widget: image
                                allow_multiple: false
                                choose_url: false
                                media_folder: /content/images
                                public_folder: images
                              - name: focalPoint
                                label: Keep this part in view
                                widget: select
                                options:
                                  - label: Middle
                                    value: center
                                  - label: Top
                                    value: top
                                  - label: Bottom
                                    value: bottom
                                  - label: Left in most languages, right in Arabic
                                    value: start
                                  - label: Right in most languages, left in Arabic
                                    value: end
                                default: center
                                required: false
                                hint: Which part of the picture stays in view when it is cropped.
                          - name: link
                            label: Link
                            widget: object
                            required: false
                            fields:
                              - name: label
                                label: Link text
                                widget: string
                                pattern:
                                  [
                                    '^[^\n\r]{1,80}$',
                                    'One line, no line breaks, max 80 characters',
                                  ]
                              - name: href
                                label: Address
                                widget: string
                                pattern:
                                  [
                                    '^(https://[^\s]+|mailto:[^\s@]+@[^\s@]+)$',
                                    'A full https:// address, or mailto:someone@example.org',
                                  ]
                                hint: Must point to orcid.org or one of its subdomains, or to youtube.com or vimeo.com. Anything else is rejected when the change is checked.
                          - name: id
                            label: ID
                            widget: string
                            pattern:
                              [
                                '^[a-z][a-z0-9-]{0,59}$',
                                'Lowercase letters, digits and hyphens; must start with a letter',
                              ]
                            hint: Permanent translation key. Changing it discards every translation of this section.
                        required: false
                      - name: id
                        label: ID
                        widget: string
                        pattern:
                          [
                            '^[a-z][a-z0-9-]{0,59}$',
                            'Lowercase letters, digits and hyphens; must start with a letter',
                          ]
                        hint: Permanent translation key. Changing it discards every translation of this section.
                    required: false
                  - name: layout
                    label: Layout
                    widget: object
                    collapsed: true
                    fields:
                      - name: span
                        label: Width
                        widget: select
                        options:
                          - label: Full width
                            value: full
                          - label: Half width (pairs with the next half-width section)
                            value: half

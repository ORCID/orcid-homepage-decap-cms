                        required: false
                        hint: Half-width sections pair with the very next half-width section on wide screens.
                      - name: spacing
                        label: Space around it
                        widget: select
                        options:
                          - label: Tight
                            value: compact
                          - label: Normal
                            value: normal
                          - label: Roomy
                            value: loose
                        default: normal
                        required: false
                      - name: tone
                        label: Background
                        widget: select

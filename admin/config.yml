                          - label: White
                            value: default
                          - label: Light grey
                            value: surface
                          - label: Dark blue (white text)
                            value: brand-dark
                          - label: Pale green
                            value: brand-tint
                        default: default
                        required: false
                        hint: Each choice is a tested background and text colour pair. Colours are not editable individually.
                  - name: id
                    label: ID
                    widget: string
                    pattern:
                      [
                        '^[a-z][a-z0-9-]{0,59}$',
                        'Lowercase letters, digits and hyphens; must start with a letter',
                      ]
                    hint: Permanent translation key. Changing it discards every translation of this section.
              - name: media
                label: Video or picture with text
                widget: object

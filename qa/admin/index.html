<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ORCID homepage content editor</title>
    <style>
      /* The proposal bar is the only thing this page adds to Decap's own UI. */
      #propose-bar {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 10000;
        display: flex;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        padding: 0.6rem 1rem;
        background: #2e3d49;
        color: #fff;
        font:
          14px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #propose-bar p {
        margin: 0;
        max-width: 62ch;
      }
      #propose-bar strong {
        color: #a6ce39;
      }
      #propose-bar button {
        flex: none;
        border: 0;
        border-radius: 4px;
        padding: 0.55rem 1rem;
        font: inherit;
        font-weight: 600;
        color: #2e3d49;
        background: #a6ce39;
        cursor: pointer;
      }
      #propose-bar button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #propose-status {
        min-width: 12ch;
      }
    </style>
  </head>
  <body>
    <script>
      // Seed the in-browser repository before the CMS boots, so the editor
      // opens on the content that is live rather than on an empty form.
      window.CMS_MANUAL_INIT = true
    </script>
    <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"></script>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
